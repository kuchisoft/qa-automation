name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [saucedemo, toolshop]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Prepare app environments
      # .env is gitignored, so CI builds each app's from its committed example.
      # The values are the targets' public demo credentials; for a private
      # target, define repository Secrets with the same names instead - real
      # environment variables win over the files, so no copying is needed.
      run: |
        cp apps/saucedemo/.env.example apps/saucedemo/.env
        cp apps/toolshop/.env.example apps/toolshop/.env
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run ${{ matrix.app }} tests
      run: npm run test --workspace @qa/${{ matrix.app }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.app }}
        path: apps/${{ matrix.app }}/playwright-report/
        retention-days: 30
